<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-blue-100 to-indigo-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <div class="mx-auto h-16 w-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
        <span class="material-icons text-white text-5xl">lock</span>
      </div>
      <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
        Bem-vindo
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Faça login para acessar sua conta
      </p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-icons text-gray-400 text-xl">email</span>
            </div>
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              class="appearance-none block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out sm:text-sm"
              placeholder="seu@email.com"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Senha
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-icons text-gray-400 text-xl">lock</span>
            </div>
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              class="appearance-none block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out sm:text-sm"
              placeholder="••••••••"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center"
            >
              @if (!showPassword) {
                <span class="material-icons text-gray-400 hover:text-gray-600 text-xl">visibility</span>
              }
              @if (showPassword) {
                <span class="material-icons text-gray-400 hover:text-gray-600 text-xl">visibility_off</span>
              }
            </button>
          </div>
        </div>

        <div>
          <button
            type="submit"
            class="cursor-pointer group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
          >
            <span class="absolute left-0 inset-y-0 flex items-center pl-3">
              <span class="material-icons text-blue-300 group-hover:text-blue-200 text-xl">login</span>
            </span>
            Entrar
          </button>
        </div>
      </form>

      <!-- Link para Registro -->
      <!-- <p class="mt-6 text-center text-sm text-gray-600">
        Não tem uma conta?
        <a href="#" class="font-medium text-blue-600 hover:text-blue-500 transition duration-150 ease-in-out">
          Cadastre-se agora
        </a>
      </p> -->
    </div>
  </div>
</div>
